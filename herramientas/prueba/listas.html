<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listas más cortas</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body { background: #8d8a85; padding: 16px; font-family: var(--sans); color: #1a1917; margin: 0; }
    h1 { font-size: 22px; font-weight: 850; font-stretch: 115%; margin: 0 0 4px; }
    h2.prueba { font-size: 18px; font-weight: 850; font-stretch: 115%; margin: 30px 0 4px; }
    p.nota { margin: 0 0 10px; max-width: 70ch; }
    .controles { display: flex; gap: 8px; margin: 10px 0; }
    .controles button { font: inherit; padding: 6px 12px; border: 1px solid #1a1917; background: #f7f3eb; cursor: pointer; }
    .fila { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { font-size: 14px; font-weight: 800; margin-bottom: 4px; max-width: 360px; }
    figcaption small { display: block; font-weight: 400; }
    .tel { width: 360px; height: 640px; overflow: auto; background: var(--papel); color: var(--tinta); font-family: var(--sans); padding: 14px 16px 30px; box-sizing: border-box; }
    .tel h3 { font-size: 26px; font-weight: 850; font-stretch: 115%; margin: 0 0 2px; }
    .tel .sub { font-family: var(--mono); color: var(--tenue); font-size: 14px; margin: 0 0 12px; }
    .tel a { color: inherit; text-decoration: none; }
    .cant { font-family: var(--mono); color: var(--tenue); font-size: 14px; }

    /* Hoy: renglones */
    .renglon { display: flex; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--filete); font-weight: 750; font-size: 18px; }
    .renglon .hijo::before { content: '└ '; color: var(--tenue); font-family: var(--mono); }

    /* Familias */
    .familia { margin: 0 0 18px; }
    .familia-cab { display: flex; justify-content: space-between; align-items: baseline; border-top: 6px solid var(--c); padding-top: 6px; }
    .familia-cab b { font-size: 20px; font-weight: 850; font-stretch: 112%; }
    .familia-epoca { font-family: var(--mono); font-size: 13px; color: var(--tenue); margin: 0 0 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-family: var(--mono); font-size: 15px; padding: 5px 9px; background: color-mix(in srgb, var(--c) 22%, var(--papel)); display: inline-flex; gap: 7px; align-items: baseline; }
    .chip .cant { font-size: 12px; }
    .chip.chico { opacity: .8; }

    /* Tarjetas de familia */
    .tarjetas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tarjeta { background: var(--c); color: var(--papel); padding: 10px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; }
    
    .tarjeta b { font-size: 15px; overflow-wrap: anywhere; font-weight: 850; font-stretch: 112%; line-height: 1.05; }
    .tarjeta small { font-family: var(--mono); font-size: 12px; line-height: 1.35; opacity: .9; }
    .tarjeta .num { font-family: var(--mono); font-size: 26px; font-weight: 700; }

    /* Arquitectos con foto */
    .grilla-arq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
    .arq img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border: 4px solid var(--c); box-sizing: border-box; }
    .arq span { display: block; font-size: 13px; font-weight: 750; line-height: 1.15; margin-top: 4px; }
    .arq .sin { width: 100%; aspect-ratio: 1; background: var(--c); }

    /* Arquitectos agrupados */
    .nombres { columns: 2; column-gap: 14px; font-size: 15px; font-weight: 650; line-height: 1.25; }
    .nombres a { display: block; break-inside: avoid; padding: 3px 0; }
    .nombres a.varias { font-weight: 850; }

    /* Panel del perfil */
    dl.tablero { display: grid; grid-template-columns: 96px 1fr; gap: 8px 10px; margin: 0; font-family: var(--mono); }
    dl.tablero dt { color: var(--tenue); font-size: 13px; text-transform: uppercase; padding-top: 5px; }
    dl.tablero dd { margin: 0; display: flex; flex-wrap: wrap; gap: 5px; }
    dl.tablero .chip { --c: var(--tenue); font-size: 14px; padding: 4px 7px; }
    .mas { font-family: var(--mono); font-size: 14px; background: none; border: 1px solid var(--filete); color: var(--tinta); padding: 4px 8px; cursor: pointer; }
    .cuentas { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .cuentas button { font-family: var(--mono); font-size: 14px; padding: 6px 9px; border: 1px solid var(--filete); background: none; color: var(--tinta); cursor: pointer; }
    .cuentas button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
    .cuentas b { font-weight: 700; }
    .abierto .chips { margin-bottom: 8px; }
    .simbolo-falso { margin-top: 18px; height: 90px; background: repeating-linear-gradient(var(--filete) 0 10px, transparent 10px 20px); font-family: var(--mono); font-size: 12px; color: var(--tenue); display: grid; place-items: center; }
  </style>
</head>
<body>
  <h1>Listas más cortas</h1>
  <p class="nota">Con tus obras reales. Cada caso tiene cómo se ve hoy y dos ideas. Todo en ancho de teléfono. Los botones «más» y las cuentas se pueden tocar.</p>
  <div class="controles"><button id="claro">Claro</button><button id="oscuro">Oscuro</button></div>
  <div id="pagina"></div>
  <script type="module" src="listas.js"></script>
</body>
</html>
