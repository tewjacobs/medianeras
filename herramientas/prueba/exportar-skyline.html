<!doctype html><meta charset="utf-8"><pre id="o"></pre><script type="module">
// Genera el SVG de la pantalla de carga (skyline S3 · El siglo) para pegarlo en www/index.html.
import { cargarDatos } from './js/datos.js';
import { skyline } from './js/grafica.js';
const datos = await cargarDatos();
const ar = datos.simbolos.decadas.argentina;
const M = { 1900: 30, 1910: 40, 1920: 100, 1930: 120, 1950: 12, 1960: 30, 1970: 60, 1980: 15, 1990: 40, 2010: 45 };
const claves = [1900, 1910, 1920, 1930, 1950, 1960, 1970, 1980, 1990, 2010];
const max = Math.max(...claves.map((k) => M[k]));
const s = skyline(claves.map((k) => ({ partitura: ar[k], altura: Math.max(0.16, M[k] / max) })), { separacion: 2.5 });
s.setAttribute('class', 'skyline carga-skyline');
document.getElementById('o').textContent = s.outerHTML;
</script>
